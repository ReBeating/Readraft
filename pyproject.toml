[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novelai-studio"
version = "0.1.0"
description = "novelAI：面向长篇中文小说的 AI 辅助创作工作台。"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=48.0.1,<50",
  "fastapi>=0.140,<0.141",
  "httpx>=0.27,<0.29",
  "itsdangerous>=2.2,<3",
  "jinja2>=3.1,<4",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.9,<0.1",
  "pydantic>=2.7,<3",
  "starlette>=1.3.1,<1.4",
  "uvicorn>=0.51,<0.52",
]

[project.scripts]
novelai-backup = "app.backup:main"
novelai-model-smoke = "app.model_smoke:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
