# Replace the domain and certificate paths before enabling this file.
# This file is intended for an Nginx conf.d/sites-enabled include inside `http {}`.

limit_req_zone $binary_remote_addr zone=novelai_auth:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name novelai.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name novelai.example.com;

    ssl_certificate /etc/letsencrypt/live/novelai.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/novelai.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Leaves room for multipart framing around the default 20 MiB app limit.
    client_max_body_size 22m;

    location = /login {
        limit_req zone=novelai_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8010;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /register {
        limit_req zone=novelai_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8010;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 360s;
    }
}
